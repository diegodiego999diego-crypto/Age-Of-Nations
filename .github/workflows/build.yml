name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Evita que intente instalar el paquete 'tools' obsoleto que causa el error
          packages: ''
          accept-android-sdk-licenses: 'yes'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK Packages & Accept Licenses
        run: |
          # Instalar los paquetes necesarios para Godot 4.3
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"
          
          # Aceptar licencias automáticamente de forma silenciosa
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Respaldo: escribir manualmente los hashes de licencia por si acaso
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n8933bad161af4b6a5b573652ffc7aaf3aee85a47" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131b33910" >> $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Download and Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Install Godot Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q Godot_v4.3-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/ 2>/dev/null || true
          rm -rf ~/.local/share/godot/export_templates/templates

      - name: Pre-heat Godot Project (Import Assets)
        run: |
          cd project
          godot --headless --editor --quit || true

      - name: Export Android Debug APK
        run: |
          cd project
          mkdir -p build
          # Asegurar que Godot encuentre el SDK
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          godot --headless --export-debug "Android" build/age-of-nations-debug.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: age-of-nations-debug-apk
          path: project/build/age-of-nations-debug.apk
          if-no-files-found: error